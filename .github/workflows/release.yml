name: Release

# Push a tag like v0.1.0 to build the binaries, publish a GitHub release and update the Homebrew formula.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches the crate version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="keyloom-cli"))')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, crate version $version"; exit 1; }
      - run: cargo build --release --locked -p keyloom-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=keyloom-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/keyloom README.md LICENSE CHANGELOG.md "$name/"
          cp skills/keyloom/SKILL.md "$name/SKILL.md"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: keyloom-${{ matrix.target }}
          path: keyloom-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the Homebrew formula
        run: scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" dist > dist/keyloom.rb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh --title "keyloom ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN isn't set: copy keyloom.rb from the release to the tap by hand"; exit 0; fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/LucaKaufmann/homebrew-tap.git" tap
          cp dist/keyloom.rb tap/Formula/keyloom.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keyloom.rb
          git diff --cached --quiet || git commit -m "keyloom ${GITHUB_REF_NAME#v}"
          git push
